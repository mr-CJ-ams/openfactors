name: ci

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned dev tools
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Secret scan
        run: python tools/scan_secrets.py
      - name: Contract check
        run: python -m contracts.check_dataset_contract
      - name: OpenAPI diff
        run: python -m openfactors.api.openapi
        env:
          PYTHONPATH: src
      # dev and test are empty databases created on this runner.
      # Passwords are generated under ops/local/runtime and are not uploaded.
      # The stored historical load is not copied here.
      # The live Open-Meteo probe remains the only permitted skip.
      - name: Install the PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Start isolated databases
        run: |
          python -m ops.local_stack up dev
          python -m ops.local_stack up test
      - name: Tests
        run: pytest -rs
        env:
          OPENFACTORS_REQUIRE_DATABASE: "1"
